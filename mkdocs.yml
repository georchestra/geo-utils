site_name: geOrchestra Python library
site_description: Python clients and utilities for geOrchestra administration and metadata workflows
site_url: https://docs.georchestra.org/geo_utils/en/latest/
repo_url: https://github.com/georchestra/geo_utils
repo_name: georchestra/geo_utils
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - Home: index.md
  - Samples: samples.md
  - Technical guides:
    - Overview: api_reference.md
    - geOrchestra: api_reference/geOrchestra.md
    - GeoNetwork: api_reference/geonetwork.md
    - Console: api_reference/console.md
    - Maelstro: api_reference/maelstro.md
    - GeoServer: api_reference/geoserver.md
    - Metadata helpers: api_reference/metadata.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - callouts
  - exclude:
      glob:
        - tableofcontent.md
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: geOrchestra Python library
        - locale: fr
          name: Français
          build: true
          site_name: Bibliothèque Python geOrchestra
          nav_translations:
            Home: Accueil
            Samples: Exemples
            User guide: Guide utilisateur
            Index: Sommaire
            Getting started: Prise en main
            Technical guides: Guides techniques
            API reference: Référence de l'API
  - git-revision-date-localized:
      enable_creation_date: true

theme:
  name: material
  logo: images/georchestra-logo-white.svg
  favicon: images/favicon.ico
  language: en
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - content.code.copy

extra:
  version:
    provider: mike
  generator: false
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:psc@georchestra.org
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/georchestra
    - icon: fontawesome/brands/github
      link: https://github.com/georchestra
    - icon: fontawesome/brands/google
      link: https://groups.google.com/g/georchestra?hl=en
    - icon: fontawesome/brands/dev
      link: https://groups.google.com/group/georchestra-dev?hl=fr
    - icon: fontawesome/regular/comments
      link: https://matrix.to/#/#georchestra:osgeo.org

extra_css:
  - css/extra.css

extra_javascript:
  - assets/custom_versions.js

copyright: '© 2026 - geOrchestra'
